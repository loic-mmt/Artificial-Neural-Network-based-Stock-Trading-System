[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.1.0"
description = "ANN-based stock trading experiments, data pipelines, and backtesting tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "TA-Lib",
    "yfinance",
    "vaderSentiment==3.3.2",
    "plotly",
    "ccxt",
    "scipy",
    "statsmodels",
    "hmmlearn",
    "scikit-learn",
    "ipython",
    "tqdm",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
neural = ["torch>=2"]
sentiment = [
    "news-sentiment-feature-engineering[news] @ git+https://github.com/loic-mmt/news-sentiment-feature-engineering.git@15424a2c9fd086f4af1740a22c4a9cd032981e40",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
